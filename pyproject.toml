[project]
name = "defiende-el-servidor"
version = "0.1.0"
description = "Defiende el servidor: clasificación normal/ataque con UNSW-NB15 y versionado con Git, DVC, MLflow y Hugging Face Hub"
requires-python = "==3.12.*"
dependencies = [
    "dvc>=3.67.1",
    "huggingface-hub>=2.4.0",
    "joblib>=1.6.0",
    "mlflow>=3.17.2",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "defiende"
